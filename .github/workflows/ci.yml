name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: awaz-backend/package-lock.json

      - name: Install Backend Dependencies
        run: npm ci
        working-directory: awaz-backend

      - name: Run Backend Lint / Check
        run: |
          if npm run lint --if-present; then
            npm run lint
          fi
        working-directory: awaz-backend

  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: awaz-frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci
        working-directory: awaz-frontend

      - name: Build Frontend
        run: npm run build
        working-directory: awaz-frontend
